[project]
name = "pyliner"
version = "0.1.0"
description = "Animated moving-line graphics module."
authors = [
    {name = "Patrik Spiess",email = "patrik.spiess@bluewin.ch"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.0",
    "pygame-ce>=2.5.3",
]

[project.scripts]
pyliner = "pyliner.main:main"
pyliner-web = "pyliner.demo_server:main"

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pylint",
    "pytest",
    "pytest-cov",
    "tox",
]

[tool.poetry]
packages = [{include = "pyliner", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100
